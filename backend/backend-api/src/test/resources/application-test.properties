# Test profile configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.web.error.include-stacktrace=never

api.security.token.secret=test-secret-key-for-testing-purposes-only-minimum-256-bits
api.security.token.issuer=test-issuer
api.security.token.access-expiration-minutes=30
api.security.token.refresh-expiration-days=7

openweathermap.api.key=test-api-key
