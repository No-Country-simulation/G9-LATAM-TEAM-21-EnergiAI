services:
  mysql:
    image: mysql:8.0
    container_name: energia-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-energia2024}
      MYSQL_DATABASE: ${DB_NAME:-energia_db}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  ia-service:
    build:
      context: ./data-science/energia_mvp
    container_name: energia-ia-service
    ports:
      - "8000:8000"
    environment:
      OCI_BUCKET_NAME: ""
      OCI_ACCESS_KEY_ID: ""
      OCI_SECRET_ACCESS_KEY: ""
      OCI_ENDPOINT_URL: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend-api:
    build:
      context: ./backend/backend-api
    container_name: energia-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-jdbc:mysql://mysql:3306}
      DB_NAME: ${DB_NAME:-energia_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-energia2024}
      URL_MODELO: ${URL_MODELO:-http://ia-service:8000/analisis-energetico}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      ia-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: energia-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-api
    restart: unless-stopped

volumes:
  mysql-data:
