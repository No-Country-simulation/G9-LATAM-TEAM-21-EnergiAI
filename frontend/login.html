<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Iniciar sesión · EnergiAI</title>
  <link rel="stylesheet" href="/src/styles/style.css">
  <link rel="stylesheet" href="/src/styles/auth.css">
</head>
<body class="auth-page">
  <div class="auth-topbar">
    <div class="theme-toggle" id="themeToggle" role="button" tabindex="0" aria-label="Cambiar tema">
      <span id="themeIcon">🌙</span>
      <span id="themeLabel">Nocturno</span>
    </div>
  </div>

  <div class="auth-card">
    <h1>EnergiAI</h1>
    <p class="subtitle">Inicia sesión para analizar tu consumo energético</p>

    <div id="authError" class="auth-error" hidden></div>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="login">Usuario</label>
        <input type="text" id="login" name="login" autocomplete="username" required minlength="3" placeholder="tu_usuario">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required minlength="8" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Iniciar sesión</button>
    </form>

    <p class="auth-footer">
      ¿No tienes cuenta? <a href="/register.html">Regístrate</a>
    </p>
  </div>

  <script type="module" src="/src/pages/login.js"></script>
</body>
</html>
