<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Registro · EnergiAI</title>
  <link rel="stylesheet" href="/src/styles/style.css">
  <link rel="stylesheet" href="/src/styles/auth.css">
</head>
<body class="auth-page">
  <div class="auth-topbar">
    <div class="theme-toggle" id="themeToggle" role="button" tabindex="0" aria-label="Cambiar tema">
      <span id="themeIcon">🌙</span>
      <span id="themeLabel">Nocturno</span>
    </div>
  </div>

  <div class="auth-card">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Regístrate para guardar y analizar tu consumo</p>

    <div id="authError" class="auth-error" hidden></div>

    <form id="registerForm" class="auth-form">
      <div class="form-group">
        <label for="login">Usuario</label>
        <input type="text" id="login" name="login" autocomplete="username" required minlength="3" maxlength="100" placeholder="tu_usuario">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" maxlength="100" placeholder="Mínimo 8 caracteres">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="8" placeholder="Repite la contraseña">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Crear cuenta</button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a>
    </p>
  </div>

  <script type="module" src="/src/pages/register.js"></script>
</body>
</html>
